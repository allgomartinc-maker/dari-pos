# Runs the unit tests (money/shift/barcode logic, scanner frame cleaning, Apps Script against a fake Sheets API)
# on every push and pull request, so each commit on GitHub shows a pass/fail check.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

<!doctype html>
<html lang="fa-AF" dir="rtl">
<head>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="description" content="صندوق فروش آفلاین به زبان دری">
  <title>صندوق دری</title>
  <link rel="manifest" href="manifest.webmanifest">

    <div class="brand"><span class="logo">؋</span><span id="storeTitle"></span></div>

  <main id="main"></main>
